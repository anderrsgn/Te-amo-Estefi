<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tung Tung ♥</title>
<style>
:root{--bg:#c68df6;--ink:#3b0a6b;--btn:#5b14a8;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)}
#start button{font-size:1.4rem;font-weight:800;color:#fff;background:var(--btn);border:0;border-radius:999px;padding:18px 38px;box-shadow:0 8px 0 #3b0a6b;cursor:pointer}
#start button:active{transform:translateY(6px);box-shadow:0 2px 0 #3b0a6b}
#start p{color:var(--ink);font-weight:700;margin-top:22px}
#count{display:none}
#num{font-size:min(55vw,300px);font-weight:900;color:var(--ink);line-height:1}
#num.pop{animation:pop .43s ease-out}
@keyframes pop{0%{transform:scale(.2) rotate(-12deg);opacity:0}60%{transform:scale(1.25) rotate(4deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
#reveal{display:none;opacity:0;transition:opacity .6s}
#reveal.show{opacity:1}
.wrap{position:relative;line-height:0;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px) scale(1.02)}}
#pic{display:block;width:auto;height:auto;max-width:100vw;max-height:100vh}
.halo{position:absolute;opacity:0;pointer-events:none;will-change:opacity}
@keyframes hl{0%{opacity:0}40%{opacity:1}100%{opacity:0}}
@keyframes hlin{from{opacity:0}to{opacity:.6}}
@keyframes hlf{from{opacity:.6}to{opacity:1}}
.rip{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 12px #fff;pointer-events:none;animation:rip .6s ease-out forwards}
.rip.b{border-color:#5b14a8;box-shadow:none;animation-delay:.08s}
@keyframes rip{from{transform:scale(.2);opacity:1}to{transform:scale(3.5);opacity:0}}
.say{position:absolute;pointer-events:none;font:900 25.5px/1 system-ui,sans-serif;color:#fff;-webkit-text-stroke:2px #3b0a6b;paint-order:stroke fill;text-shadow:0 3px 0 #3b0a6b;animation:say .8s ease-out forwards}
@keyframes say{0%{transform:translate(-50%,-30%) scale(.3);opacity:0}25%{transform:translate(-50%,-90%) scale(1.2);opacity:1}100%{transform:translate(-50%,-180%) scale(1);opacity:0}}
.notif{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);width:min(92vw,400px);transform:translate(-50%,-160%);transition:transform .5s cubic-bezier(.2,1.1,.3,1);z-index:10;display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:22px;background:rgba(38,38,42,.85);border:1px solid rgba(255,255,255,.1);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 8px 30px rgba(0,0,0,.25);color:#fff}
.notif.show{transform:translate(-50%,0)}
.notif .ico{flex:none;width:40px;height:40px;border-radius:10px;background:#34c759;display:flex;align-items:center;justify-content:center}
.notif .txt{flex:1;min-width:0}
.notif b{display:block;font-size:15px}
.notif span{display:block;font-size:14px;color:#d1d1d6}
.notif small{align-self:flex-start;font-size:12px;color:#8e8e93}
</style></head><body>

<script>
const $=id=>document.getElementById(id);
const W=1086,H=1448,PAD=60;
const WORDS=[[335,325,165,120],[190,425,580,165],[390,555,175,70],[265,625,430,225],[220,840,440,125],[280,955,345,78],[255,1058,475,185]];
const CHAR=[680,510,330,595];
const HEARTS=[[195,322,88,88],[698,330,95,100],[955,692,78,82],[118,772,102,108],[118,958,70,70],[758,1125,92,108]];
const ctx=new (window.AudioContext||window.webkitAudioContext)();
const toBuf=id=>{const s=atob($(id).textContent.trim()),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer};
const dec=ab=>new Promise((ok,no)=>{const p=ctx.decodeAudioData(ab,ok,no);if(p&&p.catch)p.catch(no)});
let mBuf,tBuf;
const audioReady=Promise.all([dec(toBuf('m')).then(b=>mBuf=b),dec(toBuf('t')).then(b=>tBuf=b)]);
function play(buf,vol,at,loop){
  const s=ctx.createBufferSource(),g=ctx.createGain();
  s.buffer=buf;s.loop=!!loop;g.gain.value=vol;s.connect(g);g.connect(ctx.destination);s.start(at||0);return s;
}
function ding(at){
  [[1318.5,0],[1760,.13]].forEach(([f,d])=>{
    const o=ctx.createOscillator(),g=ctx.createGain(),t=at+d;
    o.type='sine';o.frequency.value=f;o.connect(g);g.connect(ctx.destination);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.06,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.5);
    o.start(t);o.stop(t+.55);
  });
}
const wrap=$('wrap'),pic=$('pic');
let halos=[],hearts=[];
const imgReady=(pic.decode?pic.decode():Promise.resolve()).then(()=>{
  const c=document.createElement('canvas');c.width=W;c.height=H;
  const x=c.getContext('2d');x.drawImage(pic,0,0);
  const build=([rx,ry,rw,rh],i,col)=>{
    const d=x.getImageData(rx,ry,rw,rh),p=d.data,last=i===WORDS.length-1;
    for(let k=0;k<p.length;k+=4){
      const l=.299*p[k]+.587*p[k+1]+.114*p[k+2];
      let a=Math.max(0,Math.min(255,(135-l)*5));
      if(last)a=Math.max(a,Math.max(0,Math.min(255,(l-225)*8)));
      p[k]=p[k+1]=p[k+2]=255;p[k+3]=a;
    }
    const m=document.createElement('canvas');m.width=rw;m.height=rh;m.getContext('2d').putImageData(d,0,0);
    const h=document.createElement('canvas');h.width=rw+PAD*2;h.height=rh+PAD*2;
    const g=h.getContext('2d');
    g.shadowColor=col;g.shadowBlur=24;g.shadowOffsetX=5000;
    for(let n=0;n<3;n++)g.drawImage(m,PAD-5000,PAD);
    g.shadowColor='transparent';g.shadowBlur=0;g.shadowOffsetX=0;
    g.globalCompositeOperation='destination-out';g.drawImage(m,PAD,PAD);
    h.className='halo';
    h.style.cssText='left:'+((rx-PAD)/W*100)+'%;top:'+((ry-PAD)/H*100)+'%;width:'+((rw+PAD*2)/W*100)+'%;height:'+((rh+PAD*2)/H*100)+'%';
    wrap.appendChild(h);return h;
  };
  halos=WORDS.map((w,i)=>build(w,i,'#fff'));
  hearts=HEARTS.map(w=>build(w,-1,'#9b30ff'));
});
const ready=Promise.all([audioReady,imgReady]);
const STEP=800,LEAD=600;
$('go').onclick=async()=>{
  const btn=$('go');btn.disabled=true;
  try{ctx.resume()}catch(e){}
  await ready;
  $('start').style.display='none';
  $('count').style.display='flex';
  const m0=ctx.currentTime+.05;
  play(mBuf,.8,m0,true);
  const nd=Math.max(0,mBuf.duration-2);
  ding(m0+nd);
  setTimeout(()=>{const n=$('notif');n.classList.add('show');
    hearts.forEach(h=>{h.style.animation='hlin .5s ease-out both';setTimeout(()=>{h.style.animation='hlf 1.2s ease-in-out infinite alternate both'},500)});
    setTimeout(()=>n.classList.remove('show'),4500)},nd*1000+50);
  let n=5;const num=$('num');
  const show=()=>{num.textContent=n;num.classList.remove('pop');void num.offsetWidth;num.classList.add('pop')};
  show();
  const t=setInterval(()=>{
    n--;
    if(n>0){show();return}
    clearInterval(t);
    $('count').style.display='none';
    const r=$('reveal');r.style.display='flex';
    requestAnimationFrame(()=>{
      r.classList.add('show');
      halos.forEach((h,i)=>{
        const d=LEAD+i*STEP;
        h.style.animation=i<halos.length-1?'hl .9s ease-in-out '+d+'ms both':'hlf 1.2s ease-in-out '+d+'ms infinite alternate both';
      });
      const T=ctx.currentTime+(LEAD+3*STEP)/1000;
      play(tBuf,.05,T);play(tBuf,.05,T+.28);
    });
  },430);
};
wrap.addEventListener('pointerdown',e=>{
  if(!tBuf)return;
  const r=pic.getBoundingClientRect();
  const ix=(e.clientX-r.left)/r.width*W,iy=(e.clientY-r.top)/r.height*H;
  const [x,y,w,hh]=CHAR;
  if(ix<x||ix>x+w||iy<y||iy>y+hh)return;
  play(tBuf,.9);
  const L=(ix/W*100)+'%',T=(iy/H*100)+'%',made=[];
  const add=(cls,html)=>{const n=document.createElement('span');n.className=cls;n.style.left=L;n.style.top=T;if(html)n.textContent=html;wrap.appendChild(n);made.push(n)};
  add('rip');add('rip b');add('say','\u00a1Tung!');
  setTimeout(()=>made.forEach(n=>n.remove()),900);
});
</script></body></html>
